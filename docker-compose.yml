version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nagarbondhu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nagarbondhu
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nagarbondhu']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nagarbondhu-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/nagarbondhu?schema=public
      JWT_SECRET: nagarbondhu_competition_super_jwt_secret_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      MAX_DUPLICATE_DISTANCE_METERS: 300
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/apps/api/uploads

volumes:
  postgres_data:
  api_uploads:
