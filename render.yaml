services:
  - type: web
    name: nagarbondhu-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev --workspace=@nagarbondhu/shared --workspace=@nagarbondhu/api && npm run build:shared && npm --prefix apps/api run build
    startCommand: npm --prefix apps/api run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      - key: OPERATOR_PASSWORD_HASH
        sync: false
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: nagarbondhu-db
          property: connectionString
databases:
  - name: nagarbondhu-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
